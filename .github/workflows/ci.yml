name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from package.json's `packageManager` field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm compile

      # The suite is in-memory but for `git`, which the runner has, and the
      # CLI test, which spawns `node src/cli.ts` with a PATH that hides `claude`
      # on purpose — so nothing here needs a login or a secret.
      - run: pnpm test

      - run: pnpm build

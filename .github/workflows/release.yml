name: Release

# Publishes on a pushed tag: `npm version <x.y.z> && git push --follow-tags`.
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # `gh release create` writes a release object against the pushed tag.
      contents: write
      # Required for npm trusted publishing (OIDC) and provenance.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1 for OIDC; the runner's bundled
      # npm is not guaranteed to be new enough.
      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      - run: pnpm compile

      # `prepack` builds dist/ on its own, but failing here is a clearer signal.
      - run: pnpm build

      # Authenticated by the NPM_TOKEN repo secret: a granular access token
      # scoped to this package with 2FA bypass enabled, which npm requires for
      # unattended publishing. It expires, so a release failing here with a 404
      # on PUT usually means the token needs regenerating, not that anything is
      # wrong with the package.
      - run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # The tag alone leaves the repo's Releases panel showing whatever was
      # last created by hand, which is how v0.0.2 stayed "Latest" after 0.0.3
      # was on npm. Runs after the publish, so a release only ever names a
      # version that actually shipped.
      - run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
